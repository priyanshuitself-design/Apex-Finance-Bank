<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Insurance</title>

<link rel="stylesheet" href="new-insurance.css">
</head>
<body>

<div class="container">

<div class="form-card">

<h1>Insurance Registration</h1>

<form id="insuranceForm">

<input type="text"
placeholder="Full Name"
required>

<input type="email"
placeholder="Email"
required>

<input type="tel"
placeholder="Mobile Number"
required>

<select required>

<option value="">
Select Insurance Type
</option>

<option>Life Insurance</option>
<option>Health Insurance</option>
<option>Vehicle Insurance</option>

</select>

<input type="number"
placeholder="Coverage Amount"
required>

<input type="number"
placeholder="Policy Term"
required>

<button>
Submit Application
</button>

</form>

</div>

</div>

<script src="new-insurance.js"></script>

</body>
</html>
