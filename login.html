<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Finance Bank Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <!-- Left Side -->
    <div class="left">
        <h1>Welcome Back to Apex Finance Bank </h1>
        <p>Your trusted digital banking partner</p>

        <div class="badge badge1">👥 2M+ Customers</div>
        <div class="badge badge2">💳 500M+ Transactions</div>
        <div class="badge badge3">↗ 99.9% Uptime</div>

    </div>

    <!-- Right Side -->
    <div class="right">

        <div class="form-box">

            <div class="logo">
                <div class="logo-icon"></div>
                <h2>APEX FINANCE BANK</h2>
            </div>

            <h1>Sign In</h1>
            <p class="subtitle">Access your banking dashboard</p>

            <form>
                <label>Customer ID</label>
                <input type="text" placeholder="••••••••">

                <label>Password</label>
                <input type="password" placeholder="••••••••">

                <div class="options">

                    <a href="#">Forgot Password?</a>
                </div>

                <button class="signin-btn">Sign In →</button>
            </form>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
