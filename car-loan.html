<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Car Loan Application</title>

<link rel="stylesheet" href="loan-form.css">
</head>
<body>

<div class="container">

<div class="form-card">

<h1>Car Loan Application</h1>

<form id="loanForm">

<h3>Applicant Details</h3>

<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email" required>
<input type="tel" placeholder="Mobile Number" required>

<h3>Vehicle Details</h3>

<input type="text" placeholder="Car Model" required>
<input type="text" placeholder="Manufacturer" required>
<input type="number" placeholder="Vehicle Price" required>

<h3>Loan Requirement</h3>

<input type="number" placeholder="Required Loan Amount" required>

<select required>

<option value="">
Select Tenure
</option>

<option>3 Years</option>
<option>5 Years</option>
<option>7 Years</option>

</select>

<button>
Submit Application
</button>

</form>

</div>

</div>

<script src="loan-form.js"></script>

</body>
</html>
