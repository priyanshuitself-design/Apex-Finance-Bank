<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Loan Application</title>

<link rel="stylesheet" href="loan-form.css">
</head>
<body>

<div class="container">

    <div class="form-card">

        <h1>Personal Loan Application</h1>

        <form id="loanForm">

            <h3>Personal Details</h3>

            <input
                type="text"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                placeholder="Mobile Number"
                required
            >

            <input
                type="text"
                placeholder="PAN Number"
                required
            >

            <h3>Employment Details</h3>

            <input
                type="text"
                placeholder="Company Name"
                required
            >

            <input
                type="number"
                placeholder="Monthly Income"
                required
            >

            <input
                type="number"
                placeholder="Work Experience (Years)"
                required
            >

            <h3>Loan Details</h3>

            <input
                type="number"
                placeholder="Required Loan Amount"
                required
            >

            <select required>
                <option value="">
                    Select Tenure
                </option>

                <option>
                    1 Year
                </option>

                <option>
                    3 Years
                </option>

                <option>
                    5 Years
                </option>

            </select>

            <button>
                Submit Application
            </button>

        </form>

    </div>

</div>

<script src="loan-form.js"></script>

</body>
</html>
